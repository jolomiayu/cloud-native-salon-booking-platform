name: Deploy Cloud-Native Salon Booking Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository contents
        run: |
          pwd
          ls -la

      - name: Display tool versions
        run: |
          git --version
          docker --version

      - name: Build backend Docker image
        run: |
          docker build -t salon-backend:latest ./backend