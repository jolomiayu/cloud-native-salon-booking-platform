name: Deploy Cloud-Native Salon Booking Platform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build backend Docker image
        run: |
          docker build -t salon-backend:${IMAGE_TAG} ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t salon-frontend:${IMAGE_TAG} ./frontend

      - name: Tag backend image
        run: |
          docker tag salon-backend:${IMAGE_TAG} 825765402564.dkr.ecr.eu-west-1.amazonaws.com/cloud-native-salon-booking-platform-backend:${IMAGE_TAG}

      - name: Tag frontend image
        run: |
          docker tag salon-frontend:${IMAGE_TAG} 825765402564.dkr.ecr.eu-west-1.amazonaws.com/cloud-native-salon-booking-platform-frontend:${IMAGE_TAG}

      - name: Push backend image
        run: |
          docker push 825765402564.dkr.ecr.eu-west-1.amazonaws.com/cloud-native-salon-booking-platform-backend:${IMAGE_TAG}

      - name: Push frontend image
        run: |
          docker push 825765402564.dkr.ecr.eu-west-1.amazonaws.com/cloud-native-salon-booking-platform-frontend:${IMAGE_TAG}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/cloud-native-salon-booking-platform

            git pull origin main

            set -e

            echo "Deploying image tag: ${{ env.IMAGE_TAG }}"

            helm upgrade --install salon-app ./salon-booking-chart \
               --set image.tag="${{ env.IMAGE_TAG }}" \
               --set frontend.image.tag="${{ env.IMAGE_TAG }}"

            echo "Waiting 20 seconds for Kubernetes to reconcile..."
            sleep 20

            kubectl rollout status deployment/salon-booking --timeout=180s
            kubectl rollout status deployment/salon-booking-frontend --timeout=180s

            echo "Deployment completed successfully!"