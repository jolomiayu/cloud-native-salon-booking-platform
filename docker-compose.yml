version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: salon-postgres
    restart: always
    environment:
      POSTGRES_USER: salon_user
      POSTGRES_PASSWORD: SalonPass123!
      POSTGRES_DB: salon_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: salon-backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"

volumes:
  postgres-data:
