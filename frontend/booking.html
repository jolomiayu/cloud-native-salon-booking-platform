<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Salon Booking</h2>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#" id="logout">Logout</a></li>
    </ul>
</nav>

<header class="hero">

    <h1>Book Appointment</h1>

    <form id="bookingForm">

        <input
            type="text"
            id="customer"
            placeholder="Customer Name"
            required
        >

        <br><br>

        <input
            type="text"
            id="service"
            placeholder="Service"
            required
        >

        <br><br>

        <input
            type="date"
            id="booking_date"
            required
        >

        <br><br>

        <input
            type="time"
            id="booking_time"
            required
        >

        <br><br>

        <button type="submit">
            Book Appointment
        </button>

    </form>

    <p id="message"></p>

</header>

<script src="booking.js"></script>

</body>
</html>
