<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Salon Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Salon Booking</h2>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="register.html">Register</a></li>
    </ul>
</nav>

<header class="hero">

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</header>

<script src="login.js"></script>

</body>
</html>
